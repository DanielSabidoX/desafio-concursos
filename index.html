<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASTER — Jogo de Perguntas e Apostas</title>

<!-- ===== CACHE BUSTING — mude APP_VERSION pra forçar reload dos arquivos ===== -->
<script>window.APP_VERSION='1.0.0';</script>
<script>
  // Reescreve todos os <script src> e <link href> locais com ?v=APP_VERSION
  document.addEventListener('DOMContentLoaded', function(){
    var v = window.APP_VERSION || '0';
    document.querySelectorAll('script[src], link[rel="stylesheet"][href]').forEach(function(el){
      var attr = el.hasAttribute('src') ? 'src' : 'href';
      var url = el.getAttribute(attr);
      if(!url || url.indexOf('http') === 0) return; // pula externos
      var base = url.split('?')[0];
      el.setAttribute(attr, base + '?v=' + v);
    });
  });
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="theme.css">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="board.css">

<link rel="stylesheet" href="placar.css">
<link rel="stylesheet" href="regras.css">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="panel-nav.css">
</head>
<body>
<div class="wrap" id="app"></div>

<!-- ===== Painéis independentes (um por arquivo, como no Detetive) ===== -->

<div id="fichas-painel"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="main.js"></script>
<script src="board.js"></script>
<script src="fichas.js"></script>
<script src="placar.js"></script>
<script src="regras.js"></script>
<script src="admin.js"></script>
<script src="panel-nav.js"></script>
<script>
  function safeMount(fn, sel){
    try { if (typeof window[fn] === 'function') window[fn](sel); }
    catch (e) { console.warn('[master] falha ao montar ' + fn, e); }
  }
  safeMount('mountBoard', '#tabuleiro-painel');
  safeMount('mountFichas', '#fichas-painel');
  safeMount('mountPlacar', '#placar-painel');
  safeMount('mountRegras', '#regras-painel');
  safeMount('mountAdmin', '#admin-painel');
  safeMount('mountPanelNav', '#panel-tabbar');
</script>
